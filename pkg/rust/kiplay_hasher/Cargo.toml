[package]
name = "kiplay_hasher"
version = "6.0.0"
edition = "2021"
description = "Hasher SHA-256/SHA-512 cepat untuk Mas Kiplay"
license = "MIT"

[[bin]]
name = "kiplay_hasher"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
strip = true
