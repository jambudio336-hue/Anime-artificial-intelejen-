name: Validate Web App

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/**, feat/**]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          start = html.rfind("<script>")
          if start < 0:
              raise SystemExit("Tidak menemukan tag script")
          start += len("<script>")
          end = html.find("</script>", start)
          if end < 0:
              raise SystemExit("Tag script tidak ditutup")
          script = html[start:end]
          Path("/tmp/app-inline.js").write_text(script, encoding="utf-8")
          print(f"Memeriksa inline JavaScript ({len(script)} karakter)")
          PY
          node --check /tmp/app-inline.js

      - name: Validate native command consent boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bridge = Path("pkg/kotlin/Bridge.kt").read_text(encoding="utf-8")
          checks = {
              "native confirmation helper exists": "private fun confirmNativeAction(title: String, command: String): Boolean" in bridge,
              "shell commands require native approval": 'confirmNativeAction("Konfirmasi perintah shell", cmd)' in bridge,
              "ROOT commands require native approval": 'confirmNativeAction("Konfirmasi perintah ROOT", cmd)' in bridge,
              "ROOT capability probe requires native approval": 'confirmNativeAction("Konfirmasi pemeriksaan ROOT", "id")' in bridge,
              "Termux commands require native approval": 'confirmNativeAction("Konfirmasi eksekusi Termux", cmd)' in bridge,
              "legacy Termux entry uses guarded path": 'fun termux(cmd: String): String = termuxRun(cmd, "~/")' in bridge,
              "shell and Termux length limits exist": bridge.count("cmd.length > 4096") >= 3,
              "ROOT detection does not silently execute su": 'ProcessBuilder("su", "-c", "id")' not in bridge,
              "native approval has timeout and dismissal": "latch.await(75, TimeUnit.SECONDS)" in bridge and "dialogRef.get()?.dismiss()" in bridge,
          }
          for name, ok in checks.items():
              print(("PASS " if ok else "FAIL ") + name)
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Native command consent checks failed: " + ", ".join(failed))
          PY
