name: Build APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      versi:
        description: "Versi rilis, contoh 6.0.0"
        required: true
        default: "6.0.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUNYA_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
      VERSION: ${{ inputs.versi || '6.0.1' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy 'tools' SDK package was removed; install only supported tools.
          packages: platform-tools

      - name: Siapkan folder web
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.webmanifest www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          cp icon.png www/ 2>/dev/null || true
          cp *.mp4 www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true
          sed -i "s/const APP_VER=\"[^\"]*\"/const APP_VER=\"${{ env.VERSION }}\"/" www/index.html

      - name: Pasang Capacitor
        run: |
          npm install --no-audit --no-fund
          # The repository contains only a native source stub, not a complete Gradle project.
          # Regenerate the Capacitor Android platform before copying the maintained bridge sources.
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Tulis bridge native
        run: |
          D=android/app/src/main/java/com/kiplay/agent
          mkdir -p "$D"
          cat > "$D/MainActivity.kt" <<'KOTLIN'
          package com.kiplay.agent

          import android.os.Bundle
          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  bridge.webView.addJavascriptInterface(Bridge(this), "MK")
              }
          }
          KOTLIN
          cp pkg/kotlin/Bridge.kt "$D/Bridge.kt"

      - name: Tambah izin Android
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(path)
          root = tree.getroot()
          android_ns = "{http://schemas.android.com/apk/res/android}"

          permissions = [
              "android.permission.RECORD_AUDIO",
              "android.permission.READ_MEDIA_IMAGES",
              "android.permission.CAMERA",
              "android.permission.SET_ALARM",
              "android.permission.VIBRATE",
          ]
          for permission in permissions:
              node = ET.Element("uses-permission")
              node.set(android_ns + "name", permission)
              root.insert(0, node)

          queries = ET.Element("queries")
          for package_name in ("com.termux", "com.whatsapp", "com.tradingview"):
              package = ET.SubElement(queries, "package")
              package.set(android_ns + "name", package_name)
          root.insert(len(permissions), queries)

          application = root.find("application")
          if application is None:
              raise RuntimeError("Elemen <application> tidak ditemukan di AndroidManifest.xml")
          application.set(android_ns + "usesCleartextTraffic", "true")

          ET.indent(tree, space="    ")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          ET.parse(path)
          print("AndroidManifest.xml valid.")
          PY
          sed -i 's/versionName ".*"/versionName "${{ env.VERSION }}"/' android/app/build.gradle
          sed -i 's/versionCode .*/versionCode ${{ github.run_number }}/' android/app/build.gradle

      - name: Decode keystore
        if: env.PUNYA_KEY == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$PWD/kiplay.keystore"

      - name: Build APK release (bertanda tangan)
        if: env.PUNYA_KEY == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/../kiplay.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASS }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASS }}"

      - name: Build APK release (kunci debug)
        if: env.PUNYA_KEY != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Kumpulkan APK
        run: |
          mkdir -p keluar
          F=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          cp "$F" "keluar/MasKiplay-v${{ env.VERSION }}.apk"
          ls -lh keluar

      - name: Simpan artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasKiplay-v${{ env.VERSION }}
          path: keluar/*.apk

      - name: Terbitkan release publik
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Mas Kiplay v${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            APK Mas Kiplay v${{ env.VERSION }}

            Unduh berkas `.apk` di bawah, izinkan "instal dari sumber tidak dikenal", lalu pasang.
          files: keluar/*.apk
