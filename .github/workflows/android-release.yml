name: Build APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      versi:
        description: "Versi rilis, contoh 6.0.0"
        required: true
        default: "6.0.2"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.versi || '6.0.2' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy 'tools' SDK package was removed; install only supported tools.
          packages: platform-tools

      - name: Siapkan folder web
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.webmanifest www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          cp icon.png www/ 2>/dev/null || true
          cp *.mp4 www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true
          sed -i "s/const APP_VER=\"[^\"]*\"/const APP_VER=\"${{ env.VERSION }}\"/" www/index.html

      - name: Pasang Capacitor
        run: |
          npm install --no-audit --no-fund
          # The repository contains only a native source stub, not a complete Gradle project.
          # Regenerate the Capacitor Android platform before copying the maintained bridge sources.
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Terapkan icon.png sebagai ikon launcher Android
        run: |
          set -euo pipefail
          test -s icon.png
          sudo apt-get update
          sudo apt-get install -y python3-pil
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Image.open("icon.png").convert("RGBA")
          densities = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }
          res = Path("android/app/src/main/res")
          for density, size in densities.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              # Legacy launcher icon: retain the full square artwork.
              legacy = ImageOps.contain(source, (size, size), method=Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              canvas.alpha_composite(legacy, ((size - legacy.width) // 2, (size - legacy.height) // 2))
              canvas.save(folder / "ic_launcher.png")
              canvas.save(folder / "ic_launcher_round.png")

              # Adaptive foreground: keep artwork inside Android's safe zone.
              safe = max(1, int(size * 0.68))
              foreground = ImageOps.contain(source, (safe, safe), method=Image.Resampling.LANCZOS)
              adaptive = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              adaptive.alpha_composite(foreground, ((size - foreground.width) // 2, (size - foreground.height) // 2))
              adaptive.save(folder / "ic_launcher_foreground.png")

          anydpi = res / "mipmap-anydpi-v26"
          anydpi.mkdir(parents=True, exist_ok=True)
          adaptive_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/launcher_icon_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          '''
          (anydpi / "ic_launcher.xml").write_text(adaptive_xml, encoding="utf-8")
          (anydpi / "ic_launcher_round.xml").write_text(adaptive_xml, encoding="utf-8")

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "launcher_icon_background.xml").write_text(
              '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="launcher_icon_background">#101014</color>
          </resources>
          ''',
              encoding="utf-8",
          )
          print("Ikon launcher legacy dan adaptive berhasil dibuat dari root icon.png.")
          PY

      - name: Tulis bridge native
        run: |
          D=android/app/src/main/java/com/kiplay/agent
          mkdir -p "$D"
          cat > "$D/MainActivity.kt" <<'KOTLIN'
          package com.kiplay.agent

          import android.os.Bundle
          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  bridge.webView.addJavascriptInterface(Bridge(this), "MK")
              }
          }
          KOTLIN
          cp pkg/kotlin/Bridge.kt "$D/Bridge.kt"

      - name: Tambah izin Android
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(path)
          root = tree.getroot()
          android_ns = "{http://schemas.android.com/apk/res/android}"

          permissions = [
              "android.permission.RECORD_AUDIO",
              "android.permission.READ_MEDIA_IMAGES",
              "android.permission.CAMERA",
              "android.permission.SET_ALARM",
              "android.permission.VIBRATE",
          ]
          for permission in permissions:
              node = ET.Element("uses-permission")
              node.set(android_ns + "name", permission)
              root.insert(0, node)

          queries = ET.Element("queries")
          for package_name in ("com.termux", "com.whatsapp", "com.tradingview"):
              package = ET.SubElement(queries, "package")
              package.set(android_ns + "name", package_name)
          root.insert(len(permissions), queries)

          application = root.find("application")
          if application is None:
              raise RuntimeError("Elemen <application> tidak ditemukan di AndroidManifest.xml")
          application.set(android_ns + "usesCleartextTraffic", "true")

          ET.indent(tree, space="    ")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          ET.parse(path)
          print("AndroidManifest.xml valid.")
          PY
          sed -i 's/versionName ".*"/versionName "${{ env.VERSION }}"/' android/app/build.gradle
          sed -i 's/versionCode .*/versionCode ${{ github.run_number }}/' android/app/build.gradle

      - name: Validasi secret signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Secret $name belum diatur. Build publik wajib memakai keystore pribadi."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kiplay-release.keystore"
          test -s "$RUNNER_TEMP/kiplay-release.keystore"

      - name: Build APK release (keystore pribadi)
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/kiplay-release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Verifikasi tanda tangan APK
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk -name "*.apk" -print -quit)
          test -n "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          SIGNATURE=$("$APKSIGNER" verify --verbose --print-certs "$APK")
          printf '%s\n' "$SIGNATURE"
          EXPECTED_CERT="ff:fa:7c:f7:7d:ad:05:2c:87:9d:7c:36:48:da:3a:da:c9:62:76:23:a5:df:ff:91:2b:be:1e:89:c8:83:ba:f6"
          printf '%s\n' "$SIGNATURE" | grep -Fqi "$EXPECTED_CERT" || {
            echo "::error::Fingerprint sertifikat APK tidak cocok dengan keystore release yang disiapkan."
            exit 1
          }
          mkdir -p keluar
          cp "$APK" "keluar/MasKiplay-v${{ env.VERSION }}.apk"
          rm -f "$RUNNER_TEMP/kiplay-release.keystore"

      - name: Periksa APK hasil build
        run: |
          set -euo pipefail
          test -s "keluar/MasKiplay-v${{ env.VERSION }}.apk"
          ls -lh keluar

      - name: Simpan artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasKiplay-v${{ env.VERSION }}
          path: keluar/*.apk

      - name: Terbitkan release publik
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Mas Kiplay v${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            APK Mas Kiplay v${{ env.VERSION }}

            Unduh berkas `.apk` di bawah, izinkan "instal dari sumber tidak dikenal", lalu pasang.
          files: keluar/*.apk
