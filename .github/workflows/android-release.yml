name: Build APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      versi:
        description: "Versi rilis, contoh 8.0.0"
        required: true
        default: "9.4.2"

permissions:
  contents: write

concurrency:
  group: maskiplay-android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.versi || '9.4.2' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Siapkan folder web
        run: |
          set -euo pipefail
          mkdir -p www
          cp index.html www/
          cp manifest.webmanifest www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          cp icon.png www/ 2>/dev/null || true
          cp *.mp4 www/ 2>/dev/null || true
          cp watch.html watch.js watch.css www/
          test -s www/video.mp4
          test -s www/Dashboard.mp4
          cp *.png www/ 2>/dev/null || true
          sed -i -E "s/MK · [0-9.]+/MK · ${VERSION}/" www/index.html
          grep -q "MK · ${VERSION}" www/index.html

      - name: Validasi HTML dan JavaScript
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__(); self.scripts=0; self.inside=False; self.js=[]; self.ids=set()
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if "id" in a: self.ids.add(a["id"])
                  if tag == "script": self.scripts += 1; self.inside=True
              def handle_endtag(self, tag):
                  if tag == "script": self.inside=False
              def handle_data(self, data):
                  if self.inside: self.js.append(data)
          p=Check(); p.feed(Path("index.html").read_text(encoding="utf-8")); p.close()
          if p.scripts != 1: raise SystemExit(f"Diharapkan 1 script inline, ditemukan {p.scripts}")
          required={"gate","app","menu","backBtn","vChat","vJ","vAgent","vVpn","vpnToggle","vpnStatus","inp","sndBtn","jMic","agentGo"}
          missing=required-p.ids
          if missing: raise SystemExit("Elemen penting hilang: "+", ".join(sorted(missing)))
          html=Path("index.html").read_text(encoding="utf-8")
          for token in ("video.mp4","Dashboard.mp4","window.mkBack","backBtn"):
              if token not in html: raise SystemExit("Komponen wajib hilang: "+token)
          if "<iframe" in html.lower(): raise SystemExit("Iframe pihak ketiga tidak boleh mendapat native bridge.")
          for key, url in {
              "chatgpt": "https://chatgpt.com/",
              "hackerai": "https://hackerai.co/",
              "shannon": "https://shannon-ai.com/chat",
              "ghostgpt": "https://godmod3.ai/",
              "eporner": "https://www.eporner.com/tag/indonesia-solo/",
              "artex": "https://artex.lol/",
          }.items():
              if f'{key}:{{url:"{url}"' not in html:
                  raise SystemExit(f"Konfigurasi WebView internal hilang: {key}")
          if "if(WEB_TOOLS[v])launchWebTool(v)" not in html:
              raise SystemExit("Tile/menu belum membuka layanan web dengan satu ketukan.")
          if "window.MK" not in html or "openInAppBrowser" not in html:
              raise SystemExit("Bridge browser internal tidak ditemukan.")
          Path("/tmp/maskiplay-inline.js").write_text("\n".join(p.js),encoding="utf-8")
          print(f"HTML valid secara struktural; {len(p.ids)} ID dan {p.scripts} script ditemukan.")
          PY
          node --check /tmp/maskiplay-inline.js

      - name: Validasi integrasi fitur native dan batasan keamanan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          main = Path("pkg/kotlin/MainActivity.kt").read_text(encoding="utf-8")
          vpn = Path("pkg/kotlin/id/maskiplay/vpn/VpnPlugin.kt").read_text(encoding="utf-8")
          store = Path("pkg/kotlin/id/maskiplay/vpn/VpnStore.kt").read_text(encoding="utf-8")
          scanner = Path("pkg/kotlin/id/maskiplay/net/NetworkScannerPlugin.kt").read_text(encoding="utf-8")
          import re
          port_block = re.search(r"COMMON_PORTS = intArrayOf\((.*?)\)", scanner, re.S)
          port_count = len(re.findall(r"\b\d+\b", port_block.group(1))) if port_block else 0
          html = Path("index.html").read_text(encoding="utf-8")
          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          checks = {
              "Watch plugin registration": "registerPlugin(WatchPlugin::class.java)" in main,
              "WireGuard plugin registration": "registerPlugin(VpnPlugin::class.java)" in main,
              "Network Scanner plugin registration": "registerPlugin(NetworkScannerPlugin::class.java)" in main,
              "WireGuard official config parser": "Config.parse(" in vpn,
              "WireGuard config validation before persistence": (lambda up: "Config.parse(" in up and up.index("Config.parse(") < up.index("store.save(configText)"))(vpn.split("fun up(call: PluginCall)", 1)[1].split("@PluginMethod", 1)[0]),
              "Android Keystore encryption": '"AndroidKeyStore"' in store,
              "AES-GCM storage": '"AES/GCM/NoPadding"' in store,
              "TCP scanner disclosed": "TCP connect" in scanner and port_count == 51,
              "DNS VPN disclosure": "Tidak mengalihkan seluruh trafik perangkat" in html,
              "WireGuard full tunnel UI": "WireGuard VPN · Full Tunnel" in html,
              "OpenVPN not advertised as ready": "Mesin OpenVPN 3 belum terpasang" in html,
              "App package version": package.get("version") == "9.4.2",
              "WebView user-agent version": "MasKiplay/9.4.2" in main,
              "Main WebView file access disabled": "allowFileAccess = false" in main,
              "Main WebView content access disabled": "allowContentAccess = false" in main,
              "Full-window internal browser": "ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT" in Path("pkg/kotlin/Bridge.kt").read_text(encoding="utf-8"),
              "Jarvis answer transcript": 'id="janswer"' in html,
              "Jarvis requires key with visible guidance": 'API key AI belum diatur' in html,
              "Jarvis text plus voice mode": "MODE JARVIS SUARA + TEKS" in html,
              "Native consent for shell commands": 'confirmNativeAction("Konfirmasi perintah shell", cmd)' in bridge,
              "Native consent for ROOT commands": 'confirmNativeAction("Konfirmasi perintah ROOT", cmd)' in bridge,
              "Native consent for Termux commands": 'confirmNativeAction("Konfirmasi eksekusi Termux", cmd)' in bridge,
              "Shell command length limit": "cmd.length > 4096" in bridge,
              "Native command confirmation dialog": "CountDownLatch" in bridge and "Setujui dan jalankan" in bridge,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL") + " " + name)
          if failed:
              raise SystemExit("Native integration checks failed: " + ", ".join(failed))
          PY

      - name: Pasang Capacitor
        run: |
          npm install --no-audit --no-fund
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Terapkan icon.png sebagai ikon launcher Android
        run: |
          set -euo pipefail
          test -s icon.png
          python3 -m venv "$RUNNER_TEMP/pillow-venv"
          "$RUNNER_TEMP/pillow-venv/bin/pip" install --disable-pip-version-check --no-cache-dir Pillow
          "$RUNNER_TEMP/pillow-venv/bin/python" - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Image.open("icon.png").convert("RGBA")
          densities = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          res = Path("android/app/src/main/res")
          for density, size in densities.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              legacy = ImageOps.contain(source, (size, size), method=Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              canvas.alpha_composite(legacy, ((size - legacy.width) // 2, (size - legacy.height) // 2))
              canvas.save(folder / "ic_launcher.png")
              canvas.save(folder / "ic_launcher_round.png")
              safe = max(1, int(size * 0.68))
              foreground = ImageOps.contain(source, (safe, safe), method=Image.Resampling.LANCZOS)
              adaptive = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              adaptive.alpha_composite(foreground, ((size - foreground.width) // 2, (size - foreground.height) // 2))
              adaptive.save(folder / "ic_launcher_foreground.png")

          anydpi = res / "mipmap-anydpi-v26"
          anydpi.mkdir(parents=True, exist_ok=True)
          adaptive_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/launcher_icon_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          '''
          (anydpi / "ic_launcher.xml").write_text(adaptive_xml, encoding="utf-8")
          (anydpi / "ic_launcher_round.xml").write_text(adaptive_xml, encoding="utf-8")

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "launcher_icon_background.xml").write_text(
              '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="launcher_icon_background">#050506</color>
          </resources>
          ''', encoding="utf-8")
          print("Ikon launcher selesai.")
          PY

      - name: Pasang sumber native
        run: |
          set -euo pipefail
          D=android/app/src/main/java/ai/maskiplay/app
          mkdir -p "$D"
          # Capacitor generates MainActivity.java for this package. Replace it with the Kotlin host activity to avoid duplicate JVM classes.
          find "$D" -maxdepth 1 -type f -name "MainActivity.java" -delete
          cp pkg/kotlin/MainActivity.kt "$D/MainActivity.kt"
          cp pkg/kotlin/Bridge.kt "$D/Bridge.kt"
          cp pkg/kotlin/KiplayAccessibility.kt "$D/KiplayAccessibility.kt"
          cp pkg/kotlin/MasKiplayVpnService.kt "$D/MasKiplayVpnService.kt"
          cp pkg/kotlin/VpnGateRepository.kt "$D/VpnGateRepository.kt"
          test -s "$D/MainActivity.kt"
          test -s "$D/Bridge.kt"
          test -s "$D/KiplayAccessibility.kt"
          test -s "$D/VpnGateRepository.kt"
          grep -q "^package ai.maskiplay.app" "$D/Bridge.kt"
          grep -q "^package ai.maskiplay.app" "$D/MainActivity.kt"
          grep -q "Bridge(this, web)" "$D/MainActivity.kt"
          grep -q "addJavascriptInterface(bridgeInstance, \"MK\")" "$D/MainActivity.kt"
          grep -q "KiplayAccessibility" "$D/Bridge.kt"
          grep -q "class KiplayAccessibility" "$D/KiplayAccessibility.kt"
          grep -q "class MasKiplayVpnService" "$D/MasKiplayVpnService.kt"
          grep -q "fun vpnStart" "$D/Bridge.kt"
          grep -q "fun vpnStop" "$D/Bridge.kt"
          grep -q "vpnStart" "$D/Bridge.kt"
          set -x
          echo "Checking native Kotlin source tree"
          test -d pkg/kotlin/id/maskiplay
          find pkg/kotlin/id/maskiplay -type f -maxdepth 4 -print
          NATIVE_ID=android/app/src/main/java/id/maskiplay
          mkdir -p "$NATIVE_ID"
          cp -R pkg/kotlin/id/maskiplay/. "$NATIVE_ID/"
          test -s "$NATIVE_ID/net/NetworkScannerPlugin.kt"
          test -s "$NATIVE_ID/vpn/VpnPlugin.kt"
          test -s "$NATIVE_ID/watch/WatchPlugin.kt"
          echo "Kotlin sources copied"
          mkdir -p android/app/src/main/res/layout android/app/src/main/res/xml
          install -m 0644 pkg/res/layout/activity_player.xml android/app/src/main/res/layout/activity_player.xml
          install -m 0644 pkg/res/xml/network_security_config.xml android/app/src/main/res/xml/network_security_config.xml
          test -s android/app/src/main/res/layout/activity_player.xml
          test -s android/app/src/main/res/xml/network_security_config.xml
          echo "Native resources copied"

      - name: Tulis resource service dan provider
        run: |
          set -euo pipefail
          RES=android/app/src/main/res
          mkdir -p "$RES/xml"
          cat > "$RES/xml/kiplay_a11y.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagReportViewIds|flagIncludeNotImportantViews"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:description="@string/kiplay_a11y_desc"
              android:notificationTimeout="100"
              android:summary="@string/kiplay_a11y_desc" />
          XML
          cat > "$RES/xml/file_paths.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <files-path name="files" path="." />
              <cache-path name="cache" path="." />
              <external-path name="ext" path="." />
          </paths>
          XML
          cat > "$RES/values/kiplay_strings.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="kiplay_a11y_desc">Kendali penuh perangkat untuk agent Mas Kiplay: tap, geser, ketik, baca layar, tangkapan layar.</string>
          </resources>
          XML
          test -s "$RES/xml/kiplay_a11y.xml"
          test -s "$RES/xml/file_paths.xml"

      - name: Tambah izin, service, dan provider ke manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(path)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"

          permissions = [
              "android.permission.RECORD_AUDIO",
              "android.permission.READ_MEDIA_IMAGES",
              "android.permission.READ_EXTERNAL_STORAGE",
              "android.permission.WRITE_EXTERNAL_STORAGE",
              "android.permission.CAMERA",
              "android.permission.SET_ALARM",
              "android.permission.SET_WALLPAPER",
              "android.permission.VIBRATE",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.QUERY_ALL_PACKAGES",
              "android.permission.REQUEST_INSTALL_PACKAGES",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_SPECIAL_USE",
              "com.termux.permission.RUN_COMMAND",
          ]
          for permission in permissions:
              node = ET.Element("uses-permission")
              node.set(ns + "name", permission)
              root.insert(0, node)

          queries = ET.Element("queries")
          for package_name in ("com.termux", "com.whatsapp", "com.tradingview",
                               "com.android.chrome", "com.shizuku", "moe.shizuku.privileged.api"):
              package = ET.SubElement(queries, "package")
              package.set(ns + "name", package_name)
          root.insert(len(permissions), queries)

          application = root.find("application")
          if application is None:
              raise RuntimeError("Elemen <application> tidak ditemukan")
          application.set(ns + "usesCleartextTraffic", "false")
          application.set(ns + "networkSecurityConfig", "@xml/network_security_config")
          application.set(ns + "allowBackup", "false")

          service = ET.SubElement(application, "service")
          service.set(ns + "name", ".KiplayAccessibility")
          service.set(ns + "exported", "true")
          service.set(ns + "label", "Otomasi Mas Kiplay")
          service.set(ns + "permission", "android.permission.BIND_ACCESSIBILITY_SERVICE")
          intent = ET.SubElement(service, "intent-filter")
          action = ET.SubElement(intent, "action")
          action.set(ns + "name", "android.accessibilityservice.AccessibilityService")
          meta = ET.SubElement(service, "meta-data")
          meta.set(ns + "name", "android.accessibilityservice")
          meta.set(ns + "resource", "@xml/kiplay_a11y")

          vpn_service = ET.SubElement(application, "service")
          vpn_service.set(ns + "name", ".MasKiplayVpnService")
          vpn_service.set(ns + "exported", "true")
          vpn_service.set(ns + "permission", "android.permission.BIND_VPN_SERVICE")
          vpn_service.set(ns + "foregroundServiceType", "specialUse")
          vpn_intent = ET.SubElement(vpn_service, "intent-filter")
          vpn_action = ET.SubElement(vpn_intent, "action")
          vpn_action.set(ns + "name", "android.net.VpnService")
          vpn_property = ET.SubElement(vpn_service, "property")
          vpn_property.set(ns + "name", "android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE")
          vpn_property.set(ns + "value", "VPN DNS tunnel untuk perlindungan resolusi DNS pengguna")

          provider = ET.SubElement(application, "provider")
          provider.set(ns + "name", "androidx.core.content.FileProvider")
          provider.set(ns + "authorities", "${applicationId}.files")
          provider.set(ns + "exported", "false")
          provider.set(ns + "grantUriPermissions", "true")
          pmeta = ET.SubElement(provider, "meta-data")
          pmeta.set(ns + "name", "android.support.FILE_PROVIDER_PATHS")
          pmeta.set(ns + "resource", "@xml/file_paths")

          if not any(x.get(ns + "name") == "id.maskiplay.watch.PlayerActivity" for x in application.findall("activity")):
              player = ET.SubElement(application, "activity")
              player.set(ns + "name", "id.maskiplay.watch.PlayerActivity")
              player.set(ns + "exported", "false")

          if not any(x.get(ns + "name") == "com.wireguard.android.backend.GoBackend$VpnService" for x in application.findall("service")):
              service = ET.SubElement(application, "service")
              service.set(ns + "name", "com.wireguard.android.backend.GoBackend$VpnService")
              service.set(ns + "exported", "false")
              service.set(ns + "permission", "android.permission.BIND_VPN_SERVICE")
              service.set(ns + "foregroundServiceType", "specialUse")
              intent = ET.SubElement(service, "intent-filter")
              action = ET.SubElement(intent, "action")
              action.set(ns + "name", "android.net.VpnService")
              prop = ET.SubElement(service, "property")
              prop.set(ns + "name", "android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE")
              prop.set(ns + "value", "WireGuard tunnel service")

          ET.indent(tree, space="    ")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          ET.parse(path)

          text = open(path, encoding="utf-8").read()
          for token in ("KiplayAccessibility", "MasKiplayVpnService", "FileProvider", "BIND_ACCESSIBILITY_SERVICE", "BIND_VPN_SERVICE",
                        "REQUEST_INSTALL_PACKAGES", "kiplay_a11y", "file_paths"):
              if token not in text:
                  raise SystemExit(f"manifest tidak memuat {token}")
          print("AndroidManifest.xml valid dan lengkap.")
          PY

      - name: Set versi release
        run: |
          set -euo pipefail
          sed -i 's/versionName ".*"/versionName "${{ env.VERSION }}"/' android/app/build.gradle
          sed -i 's/versionCode .*/versionCode 942000/' android/app/build.gradle
          grep -q 'versionName "${{ env.VERSION }}"' android/app/build.gradle

      - name: Tambah dependency androidx dan aturan proguard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          path = "android/app/build.gradle"
          text = open(path, encoding="utf-8").read()
          root_path = "android/build.gradle"
          root_text = open(root_path, encoding="utf-8").read()
          if "symbol-processing-gradle-plugin" not in root_text:
              root_text = root_text.replace("dependencies {", "dependencies {" + chr(10) + "        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'" + chr(10) + "        classpath 'com.google.devtools.ksp:symbol-processing-gradle-plugin:1.9.24-1.0.20'", 1)
              open(root_path, "w", encoding="utf-8").write(root_text)
          if "apply plugin: 'com.google.devtools.ksp'" not in text:
              text = text.replace("apply plugin: 'com.android.application'", "apply plugin: 'com.android.application'" + chr(10) + "apply plugin: 'kotlin-android'" + chr(10) + "apply plugin: 'com.google.devtools.ksp'", 1)
          if "kotlinOptions" not in text:
              text = text.replace("android {", "android {" + chr(10) + "    kotlinOptions { jvmTarget = '17' }" + chr(10) + "    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }", 1)
          additions = [
              'implementation "androidx.core:core:1.13.1"',
              'implementation "androidx.media3:media3-exoplayer:1.4.1"',
              'implementation "androidx.media3:media3-exoplayer-hls:1.4.1"',
              'implementation "androidx.media3:media3-ui:1.4.1"',
              'implementation "com.squareup.okhttp3:okhttp:4.12.0"',
              'implementation "com.wireguard.android:tunnel:1.0.20230706"',
              'implementation "androidx.work:work-runtime-ktx:2.9.1"',
              'implementation "androidx.room:room-runtime:2.6.1"',
              'ksp "androidx.room:room-compiler:2.6.1"',
          ]
          missing = [line for line in additions if line not in text]
          if missing:
              text = text.replace("dependencies {", "dependencies {\n    " + "\n    ".join(missing), 1)
              open(path, "w", encoding="utf-8").write(text)
          print("Dependensi native diperiksa.")
          PY
          cat > android/app/proguard-rules.pro <<'PRO'
          -keepclassmembers class ai.maskiplay.app.** {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keep class ai.maskiplay.app.** { *; }
          -keep class androidx.core.content.FileProvider { *; }
          PRO

      - name: Validasi secret signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name belum diatur."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kiplay-release.keystore"
          test -s "$RUNNER_TEMP/kiplay-release.keystore"

      - name: Build APK release
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/kiplay-release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Verifikasi APK
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk -name "*.apk" -print -quit)
          test -n "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          SIGNATURE=$("$APKSIGNER" verify --verbose --print-certs "$APK")
          printf '%s\n' "$SIGNATURE"
          EXPECTED_CERT="fffa7cf77dad052c879d7c3648da3adac9627623a5dfff912bbe1e89c883baf6"
          ACTUAL_CERT=$(printf '%s\n' "$SIGNATURE" | sed -n 's/.*certificate SHA-256 digest: *//Ip' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::Fingerprint tidak cocok. Expected $EXPECTED_CERT / Actual $ACTUAL_CERT"
            exit 1
          fi
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -n "$AAPT"
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -q "ai.maskiplay.app"
          echo "$BADGING" | grep -q "launchable-activity"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -q "KiplayAccessibility"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -q "MasKiplayVpnService"
          "$AAPT" dump resources "$APK" | grep -q "kiplay_a11y"
          mkdir -p keluar
          cp "$APK" "keluar/MasKiplay-v${{ env.VERSION }}.apk"
          rm -f "$RUNNER_TEMP/kiplay-release.keystore"

      - name: Simpan artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasKiplay-v${{ env.VERSION }}
          path: keluar/*.apk

      - name: Terbitkan release publik
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Mas Kiplay v${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            APK Mas Kiplay v${{ env.VERSION }} — Dark Brutal

            Status fitur jaringan: WireGuard GoBackend menyediakan full-tunnel berdasarkan konfigurasi milik pengguna. DNS Shield IPv4 adalah layanan terpisah. OpenVPN 3 Core tidak termasuk dalam build branch ini. Nmap tidak dibundel; fitur pemindaian memakai NetworkScanner TCP native buatan proyek.

            Splash video `video.mp4`, dashboard video `Dashboard.mp4`, navigasi tombol kembali ke dashboard, dan validasi package serta sertifikat penandatanganan pada pipeline release.

            Catatan transparansi: WireGuard memerlukan konfigurasi server dan izin VPN Android. Integrasi OpenVPN 3 Core berada di PR terpisah dan belum menjadi bagian build ini. NetworkScanner melakukan TCP connect pada 50 port umum untuk satu host; bukan implementasi Nmap.

            Unduh `.apk` di bawah, izinkan "instal dari sumber tidak dikenal", lalu pasang.

            Setelah pasang: buka **Setelan → Aksesibilitas → Otomasi Mas Kiplay → aktifkan** supaya fitur agent jalan.
          files: keluar/*.apk
